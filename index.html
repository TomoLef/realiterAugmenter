<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réalité augmentée</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      .arjs-loader {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 9999;
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.8);
        color: white;
      }
      body {
        background: #000;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader">
      <div>Chargement de la réalité augmentée...</div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        embedded
        arjs="
            trackingMethod: best;
            sourceType: webcam;
            sourceWidth: 1280;
            sourceHeight: 960;
            displayWidth: 1280;
            displayHeight: 960;
            debugUIEnabled: false;
        "
    >
      <a-marker preset="hiro">
        <a-entity
          position="0 0 0"
          scale="0.05 0.05 0.05"
          gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"
        ></a-entity>
      </a-marker>

      <!-- <a-nft
        type="nft"
        url="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/trex-image/trex"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      > -->
      
      <a-nft
        type="nft"
        url="https://tomolef.github.io/realiterAugmenter/1000001485"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >

        <a-entity
          gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"
          scale="5 5 5"
          position="50 150 0"
        ></a-entity>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener("arjs-nft-loaded", function () {
        document.querySelector(".arjs-loader").style.display = "none";
      });

      // AR.js étire la vidéo pour COUVRIR l'écran (recadrage = "zoom" en portrait).
      // On recalcule une taille "contain" et on l'applique à la vidéo ET au canvas 3D,
      // pour que le modèle reste aligné sur l'image suivie.
      function fitContain() {
        var video = document.getElementById("arjs-video");
        var canvas = document.querySelector(".a-canvas");
        if (!video || !canvas || !video.videoWidth) return;

        var vw = video.videoWidth, vh = video.videoHeight;
        var sw = window.innerWidth, sh = window.innerHeight;
        var scale = Math.min(sw / vw, sh / vh);
        var w = vw * scale, h = vh * scale;

        [video, canvas].forEach(function (el) {
          el.style.width = w + "px";
          el.style.height = h + "px";
          el.style.marginLeft = (sw - w) / 2 + "px";
          el.style.marginTop = (sh - h) / 2 + "px";
        });
      }

      // AR.js redimensionne lui-même sur "resize" : on passe juste après lui.
      function fitLater() {
        setTimeout(fitContain, 50);
        setTimeout(fitContain, 300);
      }
      window.addEventListener("resize", fitLater);
      window.addEventListener("orientationchange", fitLater);
      window.addEventListener("arjs-video-loaded", fitLater);
      document.addEventListener("DOMContentLoaded", function () {
        var video = document.getElementById("arjs-video");
        if (video) video.addEventListener("loadedmetadata", fitLater);
      });
      // filet de sécurité : la vidéo est créée dynamiquement par AR.js
      var tries = 0;
      var poll = setInterval(function () {
        var video = document.getElementById("arjs-video");
        if (video && video.videoWidth) { fitLater(); clearInterval(poll); }
        if (++tries > 40) clearInterval(poll);
      }, 250);
    </script>
  </body>
</html>
